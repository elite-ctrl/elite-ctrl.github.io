name: Decode binary assets
on:
  push:
    paths:
      - "**/*.b64"
      - ".github/workflows/decode-og.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode all base64 assets
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.b64' -type f | sort)
          for f in "${files[@]}"; do
            out="${f%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
      - name: Commit decoded binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.png' 'brand/*.png' og-share.png || true
          # add any decoded png paths
          find . -name '*.png' -not -path './.git/*' -print0 | xargs -0 git add -f
          if git diff --staged --quiet; then
            echo "No binary change"
          else
            git commit -m "Decode brand and share-card binaries"
            git push
          fi
